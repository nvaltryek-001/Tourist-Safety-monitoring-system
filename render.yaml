# Render Blueprint — free web service + free PostgreSQL.
# Render dashboard → New → Blueprint → pick this repo. Values marked
# `sync: false` are asked for during setup (nothing secret is stored here).
services:
  - type: web
    name: safetrail-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: safetrail-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false            # e.g. https://safetrail.vercel.app
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false            # your super-admin login email
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false            # 10+ chars, upper, lower, digit
      - key: EMAIL_PROVIDER
        value: brevo           # free HTTPS email; Render free blocks SMTP
      - key: EMAIL_API_KEY
        sync: false            # Brevo API key (leave empty to run without email)
      - key: EMAIL_FROM
        sync: false            # a sender address verified in Brevo
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: OTP_DEV_ECHO
        value: "false"         # set "true" ONLY for a demo without email
      - key: EXPO_PUSH_ENABLED
        value: "true"
      - key: LOCATION_RETENTION_DAYS
        value: "30"

databases:
  - name: safetrail-db
    plan: free
    region: singapore
    databaseName: safetrail
    user: safetrail
